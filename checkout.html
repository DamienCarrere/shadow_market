<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <meta name="description"
        content="Just one more step! Complete your secure and simple checkout to finalize your order. You're almost there!">
    <title>ShadowMarket/Checkout</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="checkout.js" defer></script>
</head>

<body>
    <main>
        <form id="validateForm">
            <section class="contact-information" id="contactInformation">

                <h2>Contact Information</h2>
                <div class="form">
                    <input type="email" id="email" name="email" placeholder="">
                    <label for="email">Email</label>
                    <div class="error" id="emailError"></div>
                </div>
                <div class="form">
                    <input type="tel" id="tel" name="tel" placeholder="">
                    <label for="tel">Phone</label>
                    <div class="error" id="phoneError"></div>
                </div>
                <div class="form">
                    <input type="text" id="firstName" name="firstName" placeholder="">
                    <label for="firstName">First Name</label>
                    <div class="error" id="firstNameError"></div>

                </div>
                <div class="form">
                    <input type="text" id="lastName" name="lastName" placeholder="">
                    <label for="lastName">Last Name</label>
                    <div class="error" id="lastNameError"></div>
                </div>

                <button id="vCIBtn" type="button">Next</button>
            </section>

            <section class="shipping-address" id="shippingAddress">
                <h2>Shipping Address</h2>

                <div class="form">
                    <input type="text" id="company" name="company" placeholder="">
                    <label for="company">Company (optional)</label>
                    <div class="error" id="companyError"></div>
                </div>

                <div class="form">
                    <input type="text" id="address" name="address" placeholder="">
                    <label for="address">Address</label>
                    <div class="error" id="addressError"></div>
                </div>
                </div>

                <div class="form">
                    <input type="text" id="apartment" name="apartment" placeholder="">
                    <label for="apartment">Apartment, suite, etc.</label>
                    <div class="error" id="apartmentError"></div>
                </div>

                <div class="form">
                    <input type="text" id="city" name="city" placeholder="">
                    <label for="city">City</label>
                    <div class="error" id="cityError"></div>
                </div>

                <div class="form">
                    <input type="text" id="country" name="country" placeholder="">
                    <label for="country">Country</label>
                    <div class="error" id="countryError"></div>
                </div>

                <div class="form">
                    <input type="text" id="postal" name="postal" placeholder="">
                    <label for="postal">Postal Code</label>
                    <div class="error" id="postalError"></div>

                </div>
                <button id="vSABtn" type="button">Next</button>
            </section>





            <section class="shipping-method" id="shippingMethod">


                <label for="shipping">Select method</label>
                <select class="select-design" id="shipping" name="shipping">
                    <h2>Shipping Method</h2>
                    <option value="">Select your shipping method</option>
                    <option value="standard">Standard $6.90</option>
                    <option value="point-relais">Point relais $3.90</option>
                    <option value="éco">Éco $0</option>
                </select>
                <div class="error" id="shippingError"></div>

                <button id="vSMBtn" type="button">Next</button>
            </section>


            <section>
                <div class="payment-method" id="paymentMethod">
                    <h2>Payment Method</h2>
                    <div class=" card-type" aria-label="Payment Method: Visa, Mastercard, PayPal">
                        <i class="fab fa-cc-visa fa-2x"></i>
                        <i class="fab fa-cc-mastercard fa-2x"></i>
                        <i class="fab fa-brands fa-paypal fa-2x"></i>
                    </div>

                    <div class=" form">

                        <input type="text" id="card" name="card" placeholder="">
                        <label for="card">Credit Card</label>
                        <div class="error" id="cardError"></div>
                    </div>

                    <div class="form">
                        <input type="text" id="nameOnCard" name="nameOnCard" placeholder="">
                        <label for="nameOnCard">Name on Card</label>
                        <div class="error" id="nameOnCardError"></div>
                    </div>

                    <div class="form">
                        <input type="text" id="expiration" name="expiration" placeholder="" maxlength="19"> <label
                            for="expiration">Expiration Date (MM/YY)</label>
                        <div class="error" id="expirationError"></div>

                    </div>

                    <div class="form">
                        <input type="text" id="cvv" name="cvv" placeholder="">
                        <label for="cvv">Security Code/ CVV</label>
                    </div>
                    <div class="error" id="cvv"></div>
                    <button id="vPMBtn" type="button">Next</button>
                </div>

            </section>



            <div class="checkbox-container" id="checkboxContainer">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the General Terms and Conditions of Sale</label>
            </div>
            <button class="complate-purchase" aria-label="Complate Purchase" style="display : none;">Complete
                Purchase</button>
            </div>
            </section>
        </form>
        <section class="order-summery" id="orderSummery">
            <h2 aria-label="Order Summary">Order Summary</h2>
            <div class="order-summary">

            </div>
        </section>
    </main>

    <footer>
        <p>ShadowMarket All right reserved.</p>
    </footer>

</body>

</html>
